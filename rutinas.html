<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Generador de Rutinas IA</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .icon-active {
            background-color: #38e07b !important;
            color: #122017 !important;
            border-color: #38e07b !important;
        }
        .icon-active-text {
             color: #122017 !important;
        }
        .chip-active {
            background-color: #38e07b !important;
            color: #122017 !important;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#38e07b",
              "background-light": "#f6f8f7",
              "background-dark": "#122017",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<a href="deshboard.html" class="text-black dark:text-white flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h2 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Generador de Rutinas IA</h2>
<div class="size-10"></div>
</header>
<main class="flex-1 px-4">
<h1 class="text-black dark:text-white tracking-tight text-[32px] font-bold leading-tight text-left pb-2 pt-4">Crea tu Plan de Entrenamiento</h1>
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal pb-6">Ajusta tus preferencias y deja que nuestra IA diseñe la rutina perfecta para ti.</p>
<h3 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] pb-3">Tu Objetivo Principal</h3>
<div class="flex gap-3 flex-wrap pb-6">
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full px-4 text-sm font-medium leading-normal bg-gray-200 dark:bg-white/10 text-black dark:text-white chip-active">Perder Grasa</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full px-4 text-sm font-medium leading-normal bg-gray-200 dark:bg-white/10 text-black dark:text-white">Ganar Músculo</button>
<button class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full px-4 text-sm font-medium leading-normal bg-gray-200 dark:bg-white/10 text-black dark:text-white">Mantenerse</button>
</div>
<div class="space-y-6 pb-6">
<div>
<div class="flex justify-between items-baseline pb-2">
<label class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]" for="days">Días por Semana</label>
<span class="text-primary font-bold">4 días</span>
</div>
<input class="w-full h-2 bg-gray-200 dark:bg-white/10 rounded-lg appearance-none cursor-pointer accent-primary" id="days" max="7" min="1" name="days" type="range" value="4"/>
</div>
<div>
<div class="flex justify-between items-baseline pb-2">
<label class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]" for="duration">Duración por Sesión</label>
<span class="text-primary font-bold">60 min</span>
</div>
<input class="w-full h-2 bg-gray-200 dark:bg-white/10 rounded-lg appearance-none cursor-pointer accent-primary" id="duration" max="120" min="30" name="duration" step="15" type="range" value="60"/>
</div>
</div>
<h3 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] pb-3">Equipamiento Disponible</h3>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pb-8">
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg border-2 border-primary bg-primary text-black icon-active">
<span class="material-symbols-outlined icon-active-text">fitness_center</span>
<span class="text-sm font-medium icon-active-text">Mancuernas</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg border-2 border-gray-300 dark:border-white/20 text-black dark:text-white">
<span class="material-symbols-outlined">weight</span>
<span class="text-sm font-medium">Barra</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg border-2 border-primary bg-primary text-black icon-active">
<span class="material-symbols-outlined icon-active-text">exercise</span>
<span class="text-sm font-medium icon-active-text">Máquinas</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-3 rounded-lg border-2 border-gray-300 dark:border-white/20 text-black dark:text-white">
<span class="material-symbols-outlined">self_improvement</span>
<span class="text-sm font-medium">Peso Corporal</span>
</button>
</div>
</main>
<!-- CTA Button -->
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark p-4 pt-2">
<a href="seguimientos.html" class="flex h-14 w-full items-center justify-center gap-x-2 rounded-xl bg-primary px-6 text-center text-base font-bold text-black dark:text-background-dark shadow-lg shadow-primary/30">
<span class="material-symbols-outlined">auto_awesome</span>
                Generar mi Rutina
</a>
</footer>
</div>
</body></html>
