<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Editar Perfil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#38e07b",
              "background-light": "#f6f8f7",
              "background-dark": "#122017",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark">
<div class="relative w-full flex-col font-display group/design-root" style='font-family: Lexend, "Noto Sans", sans-serif;'>
<!-- Top App Bar -->
<div class="flex items-center justify-between p-4 sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
<div class="flex size-10 shrink-0 items-center justify-center text-black dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h1 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Editar Perfil</h1>
<div class="w-10"></div>
</div>
<div class="flex flex-col gap-4 p-4 pb-28 @container">
<!-- Profile Header -->
<div class="flex w-full flex-col items-center gap-2">
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 border-2 border-primary/50" data-alt="User profile picture placeholder" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA5RkTCZffbwivm7YQxrDlhYWTFmSVAJN43EK9esZvbYCD2xlzDmjvwltt_8_pDc3kBjbQgwNrw26SVP-5rjX-Grrykn9AQHxNiJG_xaDiujUtAjixOhXiMljYAGkFeoR2laHTdLdq0svfRI5sb1lD3bQ4ecPsNrzXN24CzRak-1HKjSyEwwEYAHlKpTdEND3fFQ_UewGQun5X5e71aK3PU5VnoX-5JYjFmmPaBwyG9qo2y99ATBO_Yu_aJc6mwJppjGIdjgCQR2-Fr");'></div>
<button class="absolute bottom-1 right-1 flex h-8 w-8 items-center justify-center rounded-full bg-primary text-background-dark">
<span class="material-symbols-outlined text-base">edit</span>
</button>
</div>
<p class="text-black dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] text-center">Alex Molina</p>
</div>
<!-- Section: Información Personal -->
<div class="flex flex-col gap-4">
<h2 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] pt-4">Información Personal</h2>
<label class="flex flex-col flex-1">
<p class="text-black/80 dark:text-white/80 text-base font-medium leading-normal pb-2">Nombre y Apellido</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-black dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/10 h-14 placeholder:text-gray-400 dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal" placeholder="Ej. Alex Molina" value="Alex Molina"/>
</label>
<div class="flex w-full flex-wrap items-end gap-4">
<label class="flex flex-col min-w-20 flex-1">
<p class="text-black/80 dark:text-white/80 text-base font-medium leading-normal pb-2">Edad</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-black dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/10 h-14 placeholder:text-gray-400 dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal" placeholder="Ej. 28" value="28"/>
</label>
<label class="flex flex-col min-w-20 flex-1">
<p class="text-black/80 dark:text-white/80 text-base font-medium leading-normal pb-2">Género</p>
<select class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-black dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/10 h-14 p-[15px] text-base font-normal leading-normal">
<option>Masculino</option>
<option>Femenino</option>
<option>Otro</option>
</select>
</label>
</div>
</div>
<!-- Section: Métricas Corporales -->
<div class="flex flex-col gap-4">
<h2 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] pt-6">Métricas Corporales</h2>
<div class="flex w-full flex-wrap items-end gap-4">
<label class="flex flex-col min-w-20 flex-1">
<p class="text-black/80 dark:text-white/80 text-base font-medium leading-normal pb-2">Altura (cm)</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-black dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/10 h-14 placeholder:text-gray-400 dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal" placeholder="Ej. 180" value="180"/>
</label>
<label class="flex flex-col min-w-20 flex-1">
<p class="text-black/80 dark:text-white/80 text-base font-medium leading-normal pb-2">Peso (kg)</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-black dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/10 h-14 placeholder:text-gray-400 dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal" placeholder="Ej. 75" value="75"/>
</label>
</div>
<label class="flex flex-col flex-1">
<p class="text-black/80 dark:text-white/80 text-base font-medium leading-normal pb-2">Grasa Corporal (%)</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-black dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/10 h-14 placeholder:text-gray-400 dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal" placeholder="Ej. 15" value="15"/>
</label>
</div>
<!-- Section: Objetivos -->
<div class="flex flex-col gap-4">
<h2 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] pt-6">Objetivo Principal</h2>
<div class="grid grid-cols-1 @[24rem]:grid-cols-2 gap-3">
<div class="flex items-center gap-4 rounded-xl p-4 border-2 border-primary bg-primary/20 cursor-pointer">
<span class="material-symbols-outlined text-primary">weight</span>
<p class="font-semibold text-black dark:text-white flex-1">Perder Grasa</p>
<div class="h-5 w-5 rounded-full border-2 border-primary bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-background-dark text-sm">check</span>
</div>
</div>
<div class="flex items-center gap-4 rounded-xl p-4 border border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/10 cursor-pointer">
<span class="material-symbols-outlined text-black dark:text-white">fitness_center</span>
<p class="font-semibold text-black dark:text-white flex-1">Ganar Músculo</p>
<div class="h-5 w-5 rounded-full border-2 border-gray-400 dark:border-white/40"></div>
</div>
<div class="flex items-center gap-4 rounded-xl p-4 border border-gray-300 dark:border-white/20 bg-gray-100 dark:bg-white/10 cursor-pointer">
<span class="material-symbols-outlined text-black dark:text-white">balance</span>
<p class="font-semibold text-black dark:text-white flex-1">Mantener</p>
<div class="h-5 w-5 rounded-full border-2 border-gray-400 dark:border-white/40"></div>
</div>
</div>
</div>
<!-- Section: Preferencias Dietéticas -->
<div class="flex flex-col gap-4">
<h2 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] pt-6">Preferencias Dietéticas</h2>
<p class="text-black/80 dark:text-white/80 text-base font-medium leading-normal">Tipo de Dieta</p>
<div class="flex flex-wrap gap-3">
<button class="text-black dark:text-white font-medium py-2 px-4 rounded-full bg-gray-200 dark:bg-white/10">Omnívora</button>
<button class="text-background-dark font-medium py-2 px-4 rounded-full bg-primary">Vegetariana</button>
<button class="text-black dark:text-white font-medium py-2 px-4 rounded-full bg-gray-200 dark:bg-white/10">Vegana</button>
<button class="text-black dark:text-white font-medium py-2 px-4 rounded-full bg-gray-200 dark:bg-white/10">Keto</button>
</div>
<p class="text-black/80 dark:text-white/80 text-base font-medium leading-normal pt-2">Alergias o intolerancias</p>
<div class="flex flex-wrap gap-3">
<button class="text-background-dark font-medium py-2 px-4 rounded-full bg-primary flex items-center gap-1.5">Sin Gluten <span class="material-symbols-outlined text-base">close</span></button>
<button class="text-black dark:text-white font-medium py-2 px-4 rounded-full bg-gray-200 dark:bg-white/10">Sin Lactosa</button>
<button class="text-black dark:text-white font-medium py-2 px-4 rounded-full bg-gray-200 dark:bg-white/10">Frutos Secos</button>
<button class="text-black dark:text-white font-medium py-2 px-4 rounded-full bg-gray-200 dark:bg-white/10">Marisco</button>
</div>
</div>
</div>
<!-- Floating Action Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent">
<button class="w-full flex items-center justify-center rounded-xl bg-primary text-background-dark text-lg font-bold h-14">
                Guardar Cambios
            </button>
</div>
</div>
</body></html>
